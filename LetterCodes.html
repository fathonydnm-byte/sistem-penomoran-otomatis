  var LetterCodeGenerator = (function() {
    var context = null;
    var revision = 0;
    var ids = ['Number', 'Type', 'Month', 'Year', 'Urgency', 'Mode', 'Officer', 'Primary', 'Secondary', 'Tertiary', 'Result', 'Copy', 'Feedback'];
    var fields = {};
    ids.forEach(function(id) { fields[id] = document.getElementById('letterCode' + id); });
    var offer = document.getElementById('letterCodeOffer');
    var panel = document.getElementById('letterCodeFields');
    var openButton = document.getElementById('letterCodeOpen');
    var tertiaryField = document.getElementById('letterCodeTertiaryField');

    function find(items, code) {
      for (var i = 0; i < items.length; i++) if (items[i].code === code) return items[i];
      return null;
    }

    function populate(select, items, placeholder) {
      select.textContent = '';
      var empty = document.createElement('option');
      empty.value = ''; empty.textContent = placeholder; select.appendChild(empty);
      items.forEach(function(item) {
        var option = document.createElement('option');
        option.value = item.code;
        option.textContent = item.code + ' — ' + item.label;
        select.appendChild(option);
      });
    }

    function reset() {
      revision += 1;
      context = null;
      offer.hidden = true;
      panel.hidden = true;
      openButton.setAttribute('aria-expanded', 'false');
      openButton.textContent = 'Buat Kode Lengkap Surat';
      fields.Number.value = ''; fields.Type.value = ''; fields.Year.value = '';
      fields.Urgency.value = ''; fields.Mode.value = 'direct'; fields.Month.value = '';
      populate(fields.Officer, LETTER_CODE_MASTER.officers, 'Pilih pejabat penandatangan');
      populate(fields.Primary, LETTER_CODE_MASTER.classifications, 'Pilih klasifikasi primer');
      resetSecondary();
      document.getElementById('letterCodeOnBehalf').hidden = true;
      update();
    }

    function configure(result) {
      reset();
      if (!result || !result.success || (result.documentType !== 'Surat Dinas' && result.documentType !== 'Nota Dinas')) return;
      var number = String(result.number || '');
      var date = String(result.letterDate || '');
      if (!/^[1-9]\d*$/.test(number) || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      var parsed = new Date(date + 'T00:00:00Z');
      if (isNaN(parsed.getTime()) || parsed.toISOString().slice(0, 10) !== date) return;
      context = {number: number, documentType: result.documentType, year: date.slice(0, 4)};
      fields.Number.value = number;
      fields.Type.value = context.documentType;
      fields.Year.value = context.year;
      fields.Month.value = date.slice(5, 7);
      offer.hidden = false;
    }

    function resetTertiary() {
      populate(fields.Tertiary, [], 'Pilih klasifikasi tersier');
      fields.Tertiary.disabled = true;
      tertiaryField.hidden = true;
    }

    function resetSecondary() {
      populate(fields.Secondary, [], 'Pilih primer terlebih dahulu');
      fields.Secondary.disabled = true;
      resetTertiary();
    }

    function primaryChanged() {
      resetSecondary();
      var primary = find(LETTER_CODE_MASTER.classifications, fields.Primary.value);
      if (primary) {
        populate(fields.Secondary, primary.children, 'Pilih klasifikasi sekunder');
        fields.Secondary.disabled = false;
      }
      update();
    }

    function secondaryChanged() {
      resetTertiary();
      var primary = find(LETTER_CODE_MASTER.classifications, fields.Primary.value);
      var secondary = primary && find(primary.children, fields.Secondary.value);
      if (secondary && secondary.children.length) {
        populate(fields.Tertiary, secondary.children, 'Pilih klasifikasi tersier');
        fields.Tertiary.disabled = false;
        tertiaryField.hidden = false;
      }
      update();
    }

    function modeChanged() {
      var selectedOfficer = fields.Officer.value;
      var onBehalf = fields.Mode.value === 'onBehalf';
      populate(fields.Officer, LETTER_CODE_MASTER.officers.filter(function(officer) {
        return !onBehalf || officer.code !== 'R';
      }), 'Pilih pejabat penandatangan');
      if (!onBehalf || selectedOfficer !== 'R') fields.Officer.value = selectedOfficer;
      document.getElementById('letterCodeOnBehalf').hidden = !onBehalf;
      update();
    }

    function build() {
      if (!context || !find([{code:'B'}, {code:'Sg'}, {code:'Pt'}, {code:'R'}, {code:'SR'}], fields.Urgency.value)) return '';
      if (fields.Mode.value !== 'direct' && fields.Mode.value !== 'onBehalf') return '';
      var officer = find(LETTER_CODE_MASTER.officers, fields.Officer.value);
      if (!officer || (fields.Mode.value === 'onBehalf' && officer.code === 'R')) return '';
      var primary = find(LETTER_CODE_MASTER.classifications, fields.Primary.value);
      var secondary = primary && find(primary.children, fields.Secondary.value);
      if (!secondary) return '';
      var classification = primary.code + '.' + secondary.code;
      if (secondary.children.length) {
        var tertiary = find(secondary.children, fields.Tertiary.value);
        if (!tertiary) return '';
        classification += '.' + tertiary.code;
      }
      if (!/^(0[1-9]|1[0-2])$/.test(fields.Month.value)) return '';
      var signer = (fields.Mode.value === 'onBehalf' ? 'R/' : '') + officer.code;
      return fields.Urgency.value + '-' + context.number + '/Un.07/01/' + signer + '/' + classification + '/' + fields.Month.value + '/' + context.year;
    }

    function update() {
      fields.Result.value = build();
      fields.Copy.disabled = !fields.Result.value;
      fields.Feedback.textContent = '';
    }

    function copy() {
      var code = build();
      if (!code) return;
      var copyRevision = revision;
      function stillCurrent() { return copyRevision === revision && code === build(); }
      function fallback() {
        if (!stillCurrent()) return;
        fields.Result.focus(); fields.Result.select();
        var copied = false;
        try { copied = document.execCommand('copy'); } catch (error) { /* Manual copy remains available. */ }
        fields.Feedback.textContent = copied ? 'Kode lengkap berhasil disalin.' : 'Kode telah dipilih. Silakan salin secara manual.';
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          navigator.clipboard.writeText(code).then(function() {
            if (stillCurrent()) fields.Feedback.textContent = 'Kode lengkap berhasil disalin.';
          }, fallback);
        } catch (error) { fallback(); }
      } else { fallback(); }
    }

    ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'].forEach(function(name, index) {
      var option = document.createElement('option');
      option.value = ('0' + (index + 1)).slice(-2);
      option.textContent = name;
      fields.Month.appendChild(option);
    });
    openButton.addEventListener('click', function() {
      panel.hidden = !panel.hidden;
      openButton.setAttribute('aria-expanded', String(!panel.hidden));
      openButton.textContent = panel.hidden ? 'Buat Kode Lengkap Surat' : 'Tutup Generator Kode';
      if (!panel.hidden) fields.Urgency.focus();
    });
    fields.Primary.addEventListener('change', primaryChanged);
    fields.Secondary.addEventListener('change', secondaryChanged);
    fields.Mode.addEventListener('change', modeChanged);
    ['Urgency', 'Officer', 'Tertiary', 'Month'].forEach(function(id) { fields[id].addEventListener('change', update); });
    fields.Copy.addEventListener('click', copy);
    reset();
    return {configure: configure, reset: reset};
  })();
</script>
