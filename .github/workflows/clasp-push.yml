name: Push kode ke Apps Script

# Otomatis mengirim (clasp push) kode terbaru dari branch ini ke editor
# Apps Script setiap ada perubahan masuk. Ini HANYA menyalin kode ke editor
# Apps Script (setara "Save"/clasp push manual). Deployment web app hanya
# diperbarui jika judul commit mengandung penanda [deploy-webapp], sehingga
# push rutin tetap tidak langsung mengubah versi live.
on:
  push:
    branches:
      - claude/audit-surat-dinas-system-p9saof

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Pulihkan kredensial clasp
        run: echo "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Push ke Apps Script
        run: clasp push --force

      - name: Perbarui deployment web app
        if: contains(github.event.head_commit.message, '[deploy-webapp]')
        run: >-
          clasp deploy
          --deploymentId "AKfycbz4i88ZxnpnlvDV2bgBH3eebT2m7tAHMRo_vCJOurG1BF6HTzT28dXXss3A97gMp-DH"
          --description "GitHub ${GITHUB_SHA}"
